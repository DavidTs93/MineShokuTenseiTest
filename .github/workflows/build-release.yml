name: Release

on:
    push:
        branches:
            - master
    workflow_dispatch:  # allows manual trigger from any branch

permissions:
    contents: write  # required for releases
    actions: write   # required for artifact upload

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.get_version.outputs.version }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0  # needed for git info plugins like git-commit-id-plugin

            - name: Set up Java 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: 'temurin'
                  cache: maven

            - name: Extract project version from POM
              id: get_version
              uses: dostonhamrakulov/maven-artifact-version-extractor@v1.0
              with:
                  file_path: ${{ github.workspace }}/pom.xml

            - name: Build with Maven
              run: mvn -B clean package

            - name: Find built JAR
              id: jar
              run: echo "jar_file=$(find . -maxdepth 1 -type f -name '*.jar' | head -n 1)" >> "$GITHUB_OUTPUT"

            - name: Upload JAR as artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-${{ github.ref_name }}
                  path: ${{ steps.jar.outputs.jar_file }}
                  retention-days: 1

    release:
        if: github.ref == 'refs/heads/master'
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Download built artifact
              uses: actions/download-artifact@v4
              with:
                  name: artifact-master

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: "v${{ needs.build.outputs.version }}"
                  name: "Release v${{ needs.build.outputs.version }}"
                  body: |
                      🚀 **Automatic release from master**
                      
                      **Version:** v${{ needs.build.outputs.version }}
                  files: "*.jar"
